name: Cut Release Branch

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.4.0)'
        required: true
        type: string

jobs:
  cut-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check current release manager
        run: |
          if [[ "${{ github.actor }}" != "${{ vars.RELEASE_MANAGER }}" ]]; then
            echo "❌ ${{ github.actor }} is not the current release manager."
            exit 1
          fi
          echo "✅ Authorized."

      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Version must be in format X.Y.Z (e.g. 1.4.0), got: ${{ inputs.version }}"
            exit 1
          fi

      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Check branch doesn't already exist
        run: |
          if git ls-remote --exit-code --heads origin release/${{ inputs.version }} > /dev/null 2>&1; then
            echo "❌ release/${{ inputs.version }} already exists."
            exit 1
          fi

      - name: Create and push release branch
        run: |
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git checkout -b release/${{ inputs.version }}
          git push origin release/${{ inputs.version }}